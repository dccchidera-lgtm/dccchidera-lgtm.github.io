name: Temporary exact positioning build check
on:
  push:
    branches: [analyst-positioning-exact-text]
    paths: ['.github/workflows/temporary-analyst-build.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm install
        run: npm install
      - name: npm run build
        run: npm run build
