name: Validate portfolio pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s projects/olist-reconstruction/tests -v
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
