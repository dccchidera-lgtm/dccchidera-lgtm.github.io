name: Validate portfolio pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s projects/olist-reconstruction/tests -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/restaurant-service-analysis/requirements.txt
      - run: pip install -r projects/restaurant-service-analysis/requirements.txt
      - run: python -m unittest discover -s projects/restaurant-service-analysis/tests -v
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
